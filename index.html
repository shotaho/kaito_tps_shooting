<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Tokyo Strike - Ver 0.4.1</title>
    <style>
        :root { --ui-blue: #0044ff; --ui-red: #ff3300; --ui-green: #22cc22; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #87CEEB; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #111; z-index: 9999; }
        .hidden { display: none !important; }
        .start-btn { background: var(--ui-blue); color: white; border: 4px solid white; padding: 20px 50px; font-weight: bold; font-size: 24px; border-radius: 50px; cursor: pointer; }
        #hud { position: absolute; top: 15px; left: 15px; color: #000; pointer-events: none; font-weight: bold; z-index: 50; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px; }
        #minimap-container { position: absolute; top: 15px; right: 15px; width: 110px; height: 110px; background: rgba(0, 0, 0, 0.4); border: 3px solid white; border-radius: 50%; overflow: hidden; z-index: 50; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; display: none; }
        #joystick-bound { position: absolute; bottom: 40px; left: 40px; width: 110px; height: 110px; border: 4px solid white; border-radius: 50%; pointer-events: auto; background: rgba(255,255,255,0.2); }
        #joystick-stick { position: absolute; top: 30px; left: 30px; width: 50px; height: 50px; background: white; border-radius: 50%; }
        .action-btn { position: absolute; pointer-events: auto; border: 4px solid white; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; }
        #shoot-btn { bottom: 30px; right: 30px; width: 90px; height: 90px; background: var(--ui-red); font-size: 20px; }
        #jump-btn { bottom: 135px; right: 45px; width: 65px; height: 65px; background: var(--ui-green); font-size: 14px; }
        .version-info { position: absolute; bottom: 20px; right: 20px; font-size: 14px; background: rgba(255,255,255,0.8); padding: 2px 8px; border-radius: 4px; color: #333; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <h1 style="color: var(--ui-blue); font-size: 36px; margin: 0;">TOKYO DEFENDER</h1>
        <p>Ver 0.4.1: Road & Signal Update</p>
        <button class="start-btn" onpointerdown="handleStartGame()">GAME START</button>
    </div>

    <div id="hud" class="hidden">
        SCORE: <span id="ui-score">0</span><br>
        SHIELD: <span id="ui-hp">100</span>%
    </div>

    <div id="minimap-container" class="hidden">
        <div id="minimap-enemies" style="position:relative; width:100%; height:100%;"></div>
        <div id="minimap-player" style="position:absolute; top:50%; left:50%; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:12px solid #fff; margin-left:-6px; margin-top:-8px;"></div>
    </div>

    <div id="ui-layer">
        <div id="joystick-bound"><div id="joystick-stick"></div></div>
        <div id="shoot-btn" class="action-btn">FIRE</div>
        <div id="jump-btn" class="action-btn">JUMP</div>
    </div>

    <div class="version-info">Ver 0.4.1</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        window.state = { 
            gameActive: false, score: 0, hp: 100, 
            enemies: [], bullets: [], buildings: [],
            camYaw: 0, camPitch: 0, vY: 0, isGrounded: true
        };
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 30, 200);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(50, 120, 50);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        // --- キャラクター (スティーブ風) ---
        const playerGroup = new THREE.Group();
        const mat = (color) => new THREE.MeshPhongMaterial({ color });
        
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(0xffccaa)); head.position.y = 1.6;
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.3), mat(0x00aaff)); body.position.y = 1.0;
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.22), mat(0xffccaa)); armL.position.set(0.45, 1.0, 0); armL.geometry.translate(0, -0.3, 0);
        const armR = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.7, 0.22), mat(0xffccaa)); armR.position.set(-0.45, 1.0, 0); armR.geometry.translate(0, -0.3, 0);
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), mat(0x333333)); legL.position.set(0.15, 0.4, 0); legL.geometry.translate(0, -0.3, 0);
        const legR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), mat(0x333333)); legR.position.set(-0.15, 0.4, 0); legR.geometry.translate(0, -0.3, 0);
        
        playerGroup.add(head, body, armL, armR, legL, legR);
        scene.add(playerGroup);

        // --- パーツ作成関数 ---
        function createBuilding(x, z, w, d, h) {
            const bGroup = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(Math.random() > 0.5 ? 0xeeeeee : 0xcccccc));
            b.position.y = h/2;
            bGroup.add(b);
            // 窓
            const winMat = mat(0x336699);
            for(let fy=2; fy<h-1; fy+=3) {
                for(let fx=-w/2+1; fx<w/2; fx+=2) {
                    const win = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.1), winMat);
                    win.position.set(fx, fy, d/2+0.05); bGroup.add(win);
                    const win2 = win.clone(); win2.position.z = -d/2-0.05; bGroup.add(win2);
                }
            }
            bGroup.position.set(x, 0, z);
            scene.add(bGroup);
            window.state.buildings.push({ x: x, z: z, w: w, d: d });
        }

        function createSignal(x, z) {
            const signal = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.BoxGeometry(0.4, 6, 0.4), mat(0x333333)); pole.position.y = 3; signal.add(pole);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.5, 0.6), mat(0x111111)); head.position.y = 5.5; signal.add(head);
            const colors = [0xff0000, 0xffff00, 0x00ff00];
            colors.forEach((c, i) => {
                const light = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({color: c}));
                light.position.set(0, 6.1 - i*0.5, 0.35); signal.add(light);
            });
            signal.position.set(x, 0, z);
            scene.add(signal);
        }

        function createTokyoTower(x, z) {
            const tower = new THREE.Group();
            for(let i=0; i<12; i++) {
                const size = 7 - i * 0.5;
                const h = 5;
                const seg = new THREE.Mesh(new THREE.BoxGeometry(size, h, size), mat(i % 2 === 0 ? 0xff3300 : 0xffffff));
                seg.position.y = i * h + h/2;
                tower.add(seg);
            }
            tower.position.set(x, 0, z);
            scene.add(tower);
            window.state.buildings.push({ x: x, z: z, w: 8, d: 8 });
        }

        // --- 街の構築 ---
        function buildCity() {
            // ベース地面
            const base = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), mat(0x338833)); base.rotation.x = -Math.PI/2; scene.add(base);

            // 道路作成
            for(let i=-5; i<=5; i++) {
                // 縦の道路
                const roadV = new THREE.Mesh(new THREE.PlaneGeometry(12, 400), mat(0x333333));
                roadV.rotation.x = -Math.PI/2; roadV.position.set(i*40, 0.01, 0); scene.add(roadV);
                // 中央線
                const lineV = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 400), mat(0xffcc00));
                lineV.rotation.x = -Math.PI/2; lineV.position.set(i*40, 0.02, 0); scene.add(lineV);
                // 横の道路
                const roadH = new THREE.Mesh(new THREE.PlaneGeometry(400, 12), mat(0x333333));
                roadH.rotation.x = -Math.PI/2; roadH.position.set(0, 0.01, i*40); scene.add(roadH);
                
                // 交差点の横断歩道と信号
                for(let j=-5; j<=5; j++) {
                    // 横断歩道(簡易)
                    const zebra = new THREE.Mesh(new THREE.PlaneGeometry(8, 4), mat(0xeeeeee));
                    zebra.rotation.x = -Math.PI/2; zebra.position.set(i*40, 0.03, j*40 + 8); scene.add(zebra);
                    createSignal(i*40 + 7, j*40 + 7);
                }
            }

            // 建物
            for(let i=0; i<60; i++) {
                let x = Math.random()*300-150; let z = Math.random()*300-150;
                // 道路(x=n*40, z=n*40)に被らないように配置
                if (Math.abs(x % 40) < 12 || Math.abs(z % 40) < 12) { x += 15; z += 15; }
                if (Math.abs(x) < 10 && Math.abs(z) < 10) continue; // スタート地点
                createBuilding(x, z, 10, 10, Math.random()*20+10);
            }
            createTokyoTower(60, -60);
        }
        buildCity();

        // 衝突判定
        function checkCollision(nx, nz) {
            const r = 0.6;
            for (let b of window.state.buildings) {
                if (nx > b.x-b.w/2-r && nx < b.x+b.w/2+r && nz > b.z-b.d/2-r && nz < b.z+b.d/2+r) return true;
            }
            return false;
        }

        // 操作系
        let moveInput = { x: 0, y: 0 };
        let joyTouchId = null; let lookTouchId = null; let lastLookPos = { x: 0, y: 0 };
        let isShooting = false;

        window.addEventListener('touchstart', e => {
            if (!window.state.gameActive) return;
            for(let t of e.changedTouches) {
                if(t.clientX < window.innerWidth / 2) joyTouchId = t.identifier;
                else { lookTouchId = t.identifier; lastLookPos = { x: t.clientX, y: t.clientY }; }
            }
        });

        window.addEventListener('touchmove', e => {
            if (!window.state.gameActive) return;
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) {
                    const rect = document.getElementById('joystick-bound').getBoundingClientRect();
                    moveInput.x = Math.max(-1, Math.min(1, (t.clientX - (rect.left + 55)) / 45));
                    moveInput.y = Math.max(-1, Math.min(1, (t.clientY - (rect.top + 55)) / 45));
                    document.getElementById('joystick-stick').style.transform = `translate(${moveInput.x * 35}px, ${moveInput.y * 35}px)`;
                } else if(t.identifier === lookTouchId) {
                    window.state.camYaw -= (t.clientX - lastLookPos.x) * 0.008;
                    window.state.camPitch = Math.max(-0.6, Math.min(0.6, window.state.camPitch - (t.clientY - lastLookPos.y) * 0.006));
                    lastLookPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        window.addEventListener('touchend', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) { joyTouchId = null; moveInput = { x: 0, y: 0 }; document.getElementById('joystick-stick').style.transform = `translate(0,0)`; }
                else if(t.identifier === lookTouchId) lookTouchId = null;
            }
        });

        document.getElementById('shoot-btn').onpointerdown = () => isShooting = true;
        document.getElementById('shoot-btn').onpointerup = () => isShooting = false;
        document.getElementById('jump-btn').onpointerdown = () => { if (window.state.isGrounded) { window.state.vY = 0.25; window.state.isGrounded = false; } };

        // メインループ
        window.animate = () => {
            if (!window.state.gameActive) return;

            // 移動
            playerGroup.rotation.y = window.state.camYaw;
            const dirF = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            const dirS = new THREE.Vector3(1, 0, 0).applyQuaternion(playerGroup.quaternion);
            const speed = 0.2;
            const nx = playerGroup.position.x + (dirF.x * -moveInput.y + dirS.x * moveInput.x) * speed;
            const nz = playerGroup.position.z + (dirF.z * -moveInput.y + dirS.z * moveInput.x) * speed;
            if (!checkCollision(nx, playerGroup.position.z)) playerGroup.position.x = nx;
            if (!checkCollision(playerGroup.position.x, nz)) playerGroup.position.z = nz;

            // ジャンプ
            playerGroup.position.y += window.state.vY;
            if (playerGroup.position.y > 0) { window.state.vY -= 0.012; }
            else { playerGroup.position.y = 0; window.state.vY = 0; window.state.isGrounded = true; }

            // 歩行アニメ
            if(Math.abs(moveInput.x) > 0.1 || Math.abs(moveInput.y) > 0.1) {
                const s = Date.now() * 0.01;
                armL.rotation.x = Math.sin(s) * 0.8; armR.rotation.x = -Math.sin(s) * 0.8;
                legL.rotation.x = -Math.sin(s) * 0.8; legR.rotation.x = Math.sin(s) * 0.8;
            } else {
                armL.rotation.x = armR.rotation.x = legL.rotation.x = legR.rotation.x = 0;
            }

            // カメラ
            const camPos = new THREE.Vector3(0, 2.5 + window.state.camPitch * 4, 7).applyQuaternion(playerGroup.quaternion).add(playerGroup.position);
            camera.position.lerp(camPos, 0.15); camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            // 弾
            if(isShooting && Date.now() % 10 < 2) {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.2), mat(0xffcc00));
                b.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.3, 0));
                const target = new THREE.Vector3(0, window.state.camPitch, -1).applyQuaternion(playerGroup.quaternion).normalize();
                window.state.bullets.push({mesh: b, dir: target, life: 60}); scene.add(b);
            }
