<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#071a2d" />
    <title>TOKYO DEFENSE // PROTOTYPE</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <canvas id="game"></canvas>
      <section id="hud" aria-live="polite">
        <div class="topbar">
          <div class="brand"><span>EDF //</span> TOKYO DEFENSE</div>
          <div class="objective"><small>MISSION 01</small><strong id="objective">東京を防衛せよ</strong></div>
        </div>
        <div class="status">
          <div class="health"><span>ARMOR</span><div class="meter"><i id="hp-bar"></i></div><b id="hp">100</b></div>
          <div class="enemy-count"><span>HOSTILES</span><b id="enemy-count">08</b></div>
        </div>
        <div id="crosshair" aria-hidden="true">+</div>
        <div id="hit-marker" aria-hidden="true">×</div>
        <p id="hint">左スティックで移動　右側をスワイプして視点操作</p>
      </section>
      <section id="controls" aria-label="ゲーム操作">
        <div id="move-zone" class="move-zone" aria-label="移動スティック"><div id="stick" class="stick"></div></div>
        <button id="jump" class="action jump" aria-label="ジャンプ">JUMP</button>
        <button id="attack" class="action attack" aria-label="攻撃">FIRE</button>
      </section>
      <section id="start-screen" class="overlay">
        <div class="card">
          <p class="eyebrow">BLOCK DEFENSE FORCE</p>
          <h1>TOKYO<br><em>DEFENSE</em></h1>
          <p>未知の宇宙人が東京に侵攻。ブロック都市を駆け抜け、すべての敵を排除せよ。</p>
          <button id="start" class="primary">出動する</button>
          <small>移動：左スティック / 視点：画面右側をスワイプ / 攻撃・ジャンプ：ボタン</small>
        </div>
      </section>
      <section id="result-screen" class="overlay hidden">
        <div class="card">
          <p class="eyebrow" id="result-eyebrow">MISSION COMPLETE</p>
          <h2 id="result-title">東京を守り抜いた</h2>
          <p id="result-copy"></p>
          <button id="restart" class="primary">もう一度出動</button>
        </div>
      </section>
    </main>
    <script type="module" src="./src/game.js"></script>
  </body>
</html>
