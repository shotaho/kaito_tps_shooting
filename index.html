<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Tokyo Strike - Ver 0.3.3</title>
    <style>
        :root { --ui-blue: #0044ff; --ui-red: #ff3300; --ui-green: #22cc22; }
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #87CEEB; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; color: #111; z-index: 9999;
        }
        .hidden { display: none !important; }
        
        /* ボタン */
        .start-btn {
            background: var(--ui-blue); color: white; border: 4px solid white;
            padding: 20px 50px; font-weight: bold; font-size: 24px; border-radius: 50px;
        }

        /* プレイ画面UI */
        #hud {
            position: absolute; top: 15px; left: 15px; color: #000;
            pointer-events: none; font-weight: bold; z-index: 50;
            background: rgba(255,255,255,0.7); padding: 10px; border-radius: 8px;
        }
        #minimap-container {
            position: absolute; top: 15px; right: 15px; width: 110px; height: 110px;
            background: rgba(0, 0, 0, 0.4); border: 3px solid white; border-radius: 50%;
            overflow: hidden; z-index: 50;
        }
        
        /* 操作レイヤー */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; display: none; }
        
        /* 左手：ジョイスティック */
        #joystick-bound {
            position: absolute; bottom: 40px; left: 40px; width: 110px; height: 110px;
            border: 4px solid white; border-radius: 50%; pointer-events: auto; background: rgba(255,255,255,0.2);
        }
        #joystick-stick { position: absolute; top: 30px; left: 30px; width: 50px; height: 50px; background: white; border-radius: 50%; }
        
        /* 右手：アクションボタン */
        .action-btn {
            position: absolute; pointer-events: auto; border: 4px solid white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;
        }
        #shoot-btn { bottom: 30px; right: 30px; width: 90px; height: 90px; background: var(--ui-red); font-size: 20px; }
        #jump-btn { bottom: 135px; right: 45px; width: 65px; height: 65px; background: var(--ui-green); font-size: 14px; }

        .version-info { position: absolute; bottom: 20px; right: 20px; font-size: 14px; background: rgba(255,255,255,0.8); padding: 2px 8px; border-radius: 4px; color: #333; }
    </style>
</head>
<body>

    <div id="start-screen" class="screen">
        <h1 style="color: var(--ui-blue); font-size: 36px; margin: 0;">TOKYO DEFENDER</h1>
        <p>Ver 0.3.3: Collision & Jump Update</p>
        <button class="start-btn" onpointerdown="handleStartGame()">GAME START</button>
    </div>

    <div id="hud" class="hidden">
        SCORE: <span id="ui-score">0</span><br>
        SHIELD: <span id="ui-hp">100</span>%
    </div>

    <div id="minimap-container" class="hidden">
        <div id="minimap-enemies" style="position:relative; width:100%; height:100%;"></div>
        <div id="minimap-player" style="position:absolute; top:50%; left:50%; width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom:12px solid #fff; margin-left:-6px; margin-top:-8px;"></div>
    </div>

    <div id="ui-layer">
        <div id="joystick-bound"><div id="joystick-stick"></div></div>
        <div id="shoot-btn" class="action-btn">FIRE</div>
        <div id="jump-btn" class="action-btn">JUMP</div>
    </div>

    <div class="version-info">Ver 0.3.3</div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- ゲーム状態 ---
        window.state = { 
            gameActive: false, score: 0, hp: 100, 
            enemies: [], bullets: [], buildings: [],
            camYaw: 0, camPitch: 0,
            vY: 0, isGrounded: true
        };
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); 
        scene.fog = new THREE.Fog(0x87CEEB, 20, 160);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(50, 120, 50);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));

        // 自機
        const playerGroup = new THREE.Group();
        const mat = (color) => new THREE.MeshPhongMaterial({ color });
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), mat(0xffccaa)); head.position.y = 1.6;
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.7, 0.3), mat(0x00aaff)); body.position.y = 1.0;
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), mat(0xffccaa)); armL.position.set(0.45, 1.0, 0);
        const armR = armL.clone(); armR.position.x = -0.45;
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.7, 0.25), mat(0x333333)); legL.position.set(0.15, 0.3, 0);
        const legR = legL.clone(); legR.position.x = -0.15;
        playerGroup.add(head, body, armL, armR, legL, legR);
        scene.add(playerGroup);

        // 街の作成 & 当たり判定用データの保存
        function createCity() {
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), mat(0x999999));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
            scene.add(new THREE.GridHelper(400, 20, 0xffffff, 0xbbbbbb));

            for(let i=0; i<80; i++) {
                const h = Math.random() * 25 + 5;
                const bSize = { w: 8, d: 8, h: h };
                const b = new THREE.Mesh(new THREE.BoxGeometry(bSize.w, bSize.h, bSize.d), mat(Math.random() > 0.5 ? 0xeeeeee : 0xcccccc));
                let x = Math.random()*240-120; let z = Math.random()*240-120;
                if(Math.abs(x) < 15) x += 30; // 道路あけ
                b.position.set(x, h/2, z);
                scene.add(b);
                // 当たり判定用データを保存
                window.state.buildings.push({ x: x, z: z, w: bSize.w, d: bSize.d });
            }
        }
        createCity();

        // 衝突判定関数
        function checkCollision(nx, nz) {
            const margin = 0.6; // キャラクターの半径分
            for (let b of window.state.buildings) {
                if (nx > b.x - b.w/2 - margin && nx < b.x + b.w/2 + margin &&
                    nz > b.z - b.d/2 - margin && nz < b.z + b.d/2 + margin) {
                    return true; // 衝突あり
                }
            }
            return false;
        }

        // 敵スポーン
        window.spawnEnemy = () => {
            const e = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mat(0xff0000));
            e.position.set(Math.random()*160-80, 5, Math.random()*160-80);
            window.state.enemies.push({ mesh: e, hp: 2 });
            scene.add(e);
        };

        // 操作系
        let moveInput = { x: 0, y: 0 };
        let joyTouchId = null; let lookTouchId = null; let lastLookPos = { x: 0, y: 0 };
        let isShooting = false;
        const MOVE_SPEED = 0.2; // 速度を下げた

        window.addEventListener('touchstart', e => {
            if (!window.state.gameActive) return;
            for(let t of e.changedTouches) {
                if(t.clientX < window.innerWidth / 2) joyTouchId = t.identifier;
                else { lookTouchId = t.identifier; lastLookPos = { x: t.clientX, y: t.clientY }; }
            }
        });

        window.addEventListener('touchmove', e => {
            if (!window.state.gameActive) return;
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) {
                    const rect = document.getElementById('joystick-bound').getBoundingClientRect();
                    moveInput.x = Math.max(-1, Math.min(1, (t.clientX - (rect.left + 55)) / 45));
                    moveInput.y = Math.max(-1, Math.min(1, (t.clientY - (rect.top + 55)) / 45));
                    document.getElementById('joystick-stick').style.transform = `translate(${moveInput.x * 35}px, ${moveInput.y * 35}px)`;
                } else if(t.identifier === lookTouchId) {
                    window.state.camYaw -= (t.clientX - lastLookPos.x) * 0.008;
                    window.state.camPitch = Math.max(-0.6, Math.min(0.6, window.state.camPitch - (t.clientY - lastLookPos.y) * 0.006));
                    lastLookPos = { x: t.clientX, y: t.clientY };
                }
            }
        });

        window.addEventListener('touchend', e => {
            for(let t of e.changedTouches) {
                if(t.identifier === joyTouchId) { joyTouchId = null; moveInput = { x: 0, y: 0 }; document.getElementById('joystick-stick').style.transform = `translate(0,0)`; }
                else if(t.identifier === lookTouchId) lookTouchId = null;
            }
        });

        // ボタンイベント
        document.getElementById('shoot-btn').onpointerdown = () => isShooting = true;
        document.getElementById('shoot-btn').onpointerup = () => isShooting = false;
        document.getElementById('jump-btn').onpointerdown = () => {
            if (window.state.isGrounded) {
                window.state.vY = 0.25;
                window.state.isGrounded = false;
            }
        };

        // メインループ
        window.animate = () => {
            if (!window.state.gameActive) return;

            // 回転計算
            playerGroup.rotation.y = window.state.camYaw;
            const dirForward = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            const dirSide = new THREE.Vector3(1, 0, 0).applyQuaternion(playerGroup.quaternion);
            
            // 次の予測位置を計算（当たり判定用）
            const nextX = playerGroup.position.x + (dirForward.x * -moveInput.y + dirSide.x * moveInput.x) * MOVE_SPEED;
            const nextZ = playerGroup.position.z + (dirForward.z * -moveInput.y + dirSide.z * moveInput.x) * MOVE_SPEED;

            if (!checkCollision(nextX, playerGroup.position.z)) playerGroup.position.x = nextX;
            if (!checkCollision(playerGroup.position.x, nextZ)) playerGroup.position.z = nextZ;

            // ジャンプ・重力物理
            playerGroup.position.y += window.state.vY;
            if (playerGroup.position.y > 0) {
                window.state.vY -= 0.012; // 重力
            } else {
                playerGroup.position.y = 0;
                window.state.vY = 0;
                window.state.isGrounded = true;
            }

            // カメラ追従
            const camPos = new THREE.Vector3(0, 2.5 + window.state.camPitch * 4, 7).applyQuaternion(playerGroup.quaternion).add(playerGroup.position);
            camera.position.lerp(camPos, 0.15);
            camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            // 射撃
            if(isShooting && Date.now() % 10 < 2) {
                const b = new THREE.Mesh(new THREE.SphereGeometry(0.25), mat(0xffcc00));
                b.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.3, 0));
                const target = new THREE.Vector3(0, window.state.camPitch, -1).applyQuaternion(playerGroup.quaternion).normalize();
                window.state.bullets.push({mesh: b, dir: target, life: 60});
                scene.add(b);
            }

            // 弾丸更新
            for(let i = window.state.bullets.length-1; i>=0; i--) {
                const b = window.state.bullets[i]; b.mesh.position.add(b.dir.clone().multiplyScalar(1.6));
                if(--b.life < 0) { scene.remove(b.mesh); window.state.bullets.splice(i, 1); continue; }
                window.state.enemies.forEach((e, ei) => {
                    if(b.mesh.position.distanceTo(e.mesh.position) < 2.5) {
                        e.hp--; scene.remove(b.mesh); window.state.bullets.splice(i, 1);
                        if(e.hp <= 0) { scene.remove(e.mesh); window.state.enemies.splice(ei, 1); window.state.score += 100; document.getElementById('ui-score').innerText = window.state.score; }
                    }
                });
            }

            // ミニマップ更新
            document.getElementById('minimap-player').style.transform = `rotate(${-window.state.camYaw * 57.3}deg)`;
            const mapE = document.getElementById('minimap-enemies'); mapE.innerHTML = '';
            window.state.enemies.forEach(e => {
                const dx = (e.mesh.position.x - playerGroup.position.x) * 0.5;
                const dz = (e.mesh.position.z - playerGroup.position.z) * 0.5;
                const d = document.createElement('div'); d.className = 'enemy-dot';
                d.style.cssText = `position:absolute; width:6px; height:6px; background:red; border-radius:50%; left:calc(50% + ${dx}px); top:calc(50% + ${dz}px);`;
                mapE.appendChild(d);
            });

            renderer.render(scene, camera);
            requestAnimationFrame(window.animate);
        };

        window.handleStartGame = () => {
            if (window.state.gameActive) return;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('minimap-container').classList.remove('hidden');
            document.getElementById('ui-layer').style.display = 'block';
            window.state.gameActive = true;
            for(let i=0; i<15; i++) window.spawnEnemy();
            window.animate();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
