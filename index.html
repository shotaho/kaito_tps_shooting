<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voxel Tokyo Strike - Ver 0.2.1</title>
    <style>
        :root { --neon: #00f2ff; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        canvas { display: block; }
        
        /* HUD */
        #hud {
            position: absolute; top: 10px; left: 10px; color: var(--neon);
            pointer-events: none; text-shadow: 2px 2px #000; z-index: 10;
        }
        .bar-bg { width: 150px; height: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--neon); }
        #hp-bar { width: 100%; height: 100%; background: var(--neon); }

        /* 操作UI */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
        }
        #joystick-bound {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px; border: 2px solid var(--neon);
            border-radius: 50%; pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px; background: var(--neon);
            border-radius: 50%; opacity: 0.6;
        }
        #shoot-btn {
            position: absolute; bottom: 40px; right: 40px;
            width: 100px; height: 100px; background: rgba(255,0,80,0.4);
            border: 3px solid #ff0050; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white; font-weight: bold; pointer-events: auto;
        }

        /* 画面共通設定 */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: var(--neon); z-index: 100;
        }
        .hidden { display: none; }
        
        /* バージョン表記のスタイル */
        .version-info {
            position: absolute; bottom: 10px; right: 15px;
            font-size: 14px; opacity: 0.7; letter-spacing: 1px;
        }

        button {
            background: var(--neon); color: black; border: none;
            padding: 15px 40px; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 15px var(--neon);
        }
    </style>
</head>
<body>

    <div id="hud">
        SCORE: <span id="ui-score">0</span><br>
        SHIELD:<div class="bar-bg"><div id="hp-bar"></div></div>
    </div>

    <div id="ui-layer">
        <div id="joystick-bound"><div id="joystick-stick"></div></div>
        <div id="shoot-btn">FIRE</div>
    </div>

    <!-- ホーム（スタート）画面 -->
    <div id="start-screen" class="screen">
        <h1 style="letter-spacing: 10px;">VOXEL TOKYO</h1>
        <p style="margin-bottom: 20px; opacity: 0.8;">DISTRICT 01: NEON STREET</p>
        <button onclick="initGame()">START MISSION</button>
        <!-- バージョン表示 -->
        <div class="version-info">Ver <span id="ver-display"></span></div>
    </div>

    </script>
